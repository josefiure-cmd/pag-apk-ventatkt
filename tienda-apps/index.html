<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Aplicaciones - VentaTKT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="navbar">
            <div class="logo">
                <i class="fas fa-store"></i> <span>TKT Apps</span>
            </div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Buscar aplicaciones...">
                <i class="fas fa-search"></i>
            </div>
        </div>
    </header>

    <main class="container">
        <h2 class="section-title">Aplicaciones Disponibles</h2>
        
        <div class="apps-grid">
            
            <div class="app-card">
                <div class="app-icon">
                    <i class="fas fa-ticket-alt"></i>
                </div>
                <div class="app-info">
                    <h3>VentaTKT Móvil</h3>
                    <p>VentaTKT Oficial</p>
                </div>
                <a href="#" class="download-btn" data-app="VentaTKT Móvil">
                    <i class="fas fa-download"></i> Descargar
                </a>
            </div>

            <div class="app-card">
                <div class="app-icon" style="background: #25d366;">
                    <i class="fab fa-whatsapp"></i>
                </div>
                <div class="app-info">
                    <h3>Atención TKT</h3>
                    <p>Soporte Técnico</p>
                </div>
                <a href="#" class="download-btn" data-app="Atención TKT">
                    <i class="fas fa-download"></i> Descargar
                </a>
            </div>

            <div class="app-card">
                <div class="app-icon" style="background: #e1306c;">
                    <i class="fas fa-chart-line"></i>
                </div>
                <div class="app-info">
                    <h3>TKT Administrador</h3>
                    <p>VentaTKT Tools</p>
                </div>
                <a href="#" class="download-btn" data-app="TKT Administrador">
                    <i class="fas fa-download"></i> Descargar
                </a>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 VentaTKT. Todos los derechos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
